[package]
name = "fynix-gm"
version = "0.1.0"
description = "Fynix Game Manager — lightweight cross-store game launcher for Linux"
authors = ["Boc86"]
edition = "2021"

[lib]
name = "fynix_gm"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
regex = "1"
once_cell = "1"
libloading = "0.8"
tauri-plugin-opener = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
